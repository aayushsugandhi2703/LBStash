#cloud-config
# First-boot setup. Runs once, when the VM starts for the first time.

# ---------------------------------------------------------------
# Updates
# ---------------------------------------------------------------

package_update: true
package_upgrade: true

# ---------------------------------------------------------------
# Swap: the free micro VM has only 1 GB of RAM, so give it 4 GB of disk as extra memory
# ---------------------------------------------------------------

swap:
  filename: /swapfile
  size: 4G

# ---------------------------------------------------------------
# Software to install
# ---------------------------------------------------------------

packages:
  - docker.io            # runs the app containers
  - docker-compose-v2    # adds the `docker compose` command
  - git
  - rsync                # lets GitHub Actions copy files here
  - iptables-persistent  # keeps firewall rules after a reboot
  - fail2ban             # bans IPs that keep guessing SSH logins
  - unattended-upgrades  # installs security updates by itself

# ---------------------------------------------------------------
# Config files
# ---------------------------------------------------------------

write_files:
  # Automatic security updates: check daily, install security patches, reboot at 21:30 UTC (03:00 IST) only if one needs it
  # (a new kernel). The containers restart by themselves after a reboot.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/apt/apt.conf.d/52lbstash-unattended-upgrades
    content: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "21:30";

  # SSH: keys only, no root login
  - path: /etc/ssh/sshd_config.d/99-lbstash.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

  # Firewall: block all incoming traffic except SSH (22), http (80), https (443)
  - path: /etc/lbstash/iptables.rules
    content: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      -A INPUT -p icmp -j ACCEPT
      -A INPUT -p tcp -m conntrack --ctstate NEW --dport 22 -j ACCEPT
      -A INPUT -p tcp -m conntrack --ctstate NEW --dport 80 -j ACCEPT
      -A INPUT -p tcp -m conntrack --ctstate NEW --dport 443 -j ACCEPT
      COMMIT

# ---------------------------------------------------------------
# Start everything
# ---------------------------------------------------------------

runcmd:
  # 1. Firewall: replace Oracle's rules with ours (iptables-restore wipes the old ones; a plain reload would only add ours after them)
  - cp /etc/lbstash/iptables.rules /etc/iptables/rules.v4
  - iptables-restore < /etc/iptables/rules.v4

  # 2. Docker: start on every boot, allow the `ubuntu` user to run it
  #    The restart is needed because the firewall reload above cleared Docker's rules
  - systemctl enable docker
  - systemctl restart docker
  - usermod -aG docker ubuntu

  # 3. fail2ban: Ubuntu's default setup already watches SSH
  - systemctl enable --now fail2ban

  # 4. Security updates: run the upgrade timers
  - systemctl enable --now unattended-upgrades

  # 5. SSH: apply the settings from the config file above
  - systemctl restart ssh
