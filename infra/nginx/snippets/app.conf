# app.conf: how a server serves the app.
# Included inside every server block (port 80, 443, 8088).

# --- Security headers ---------------------------------------------------
# Drop the app's own copies so each header is sent once.
# Don't add add_header inside the locations below: it would switch these off for that location.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;

# --- Limits -------------------------------------------------------------
client_max_body_size 1m;

# --- Backends -----------------------------------------------------------
# Variables, so nginx still starts if a container is down.
set $gateway_up http://gateway:3000;   # API, Telegram, ingest
set $web_up     http://web:3000;       # web app

# --- Proxy settings -----------------------------------------------------
proxy_http_version 1.1;
proxy_read_timeout 60s;
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $remote_addr;   # real visitor IP
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# --- Routes -------------------------------------------------------------
# Called directly by Telegram / message sender (no login cookie).
location /ingest/ {
    proxy_pass $gateway_up;
}
location /telegram/webhook/ {
    proxy_pass $gateway_up;
}

# API: the web app calls /api/..., the gateway receives it without /api.
location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway_up;
}

# Everything else: the web app.
location / {
    proxy_pass $web_up;
}
