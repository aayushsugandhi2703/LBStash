# global.conf: settings for all servers + the local server.
# Included once at the top of each template (outside any server block).

# --- Security -----------------------------------------------------------
# Hide the nginx version.
server_tokens off;

# --- Docker DNS ---------------------------------------------------------
# Look up container names on every request, so a restarted container is found.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Visitor IP (Cloudflare Tunnel) -------------------------------------
# Trust Cloudflare's real-IP header, but only from Docker's private networks.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# http or https as the visitor used it.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Allow WebSockets only when the browser asks for them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# --- Compression --------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

# --- Local server (http://localhost:8088) -------------------------------
# For local use. Plain http, never redirects to https.
server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    include /etc/nginx/snippets/app.conf;
}
