# Included by both templates at the top level (http context). Shared settings, plus the plain-http port for local use.

server_tokens off;

# Docker's DNS, asked on every request (not once at start-up), so a rebuilt gateway or web container is found at its new address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind a Cloudflare Tunnel the connection comes from the tunnel container: take the visitor's address and scheme from Cloudflare's headers.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

# Plain http for local use: http://localhost:${PUBLIC_PORT} (published by docker-compose). Never redirects to https.
server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    include /etc/nginx/snippets/app-routes.conf;
}
