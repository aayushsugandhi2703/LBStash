# Included inside every `server` block that serves the app: where each path goes, plus the security headers.

client_max_body_size 1m;

set $gateway_up http://gateway:3000;
set $web_up     http://web:3000;

# One public origin. The upstreams' own copies of these headers are dropped so each is sent once.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;

proxy_http_version 1.1;
proxy_read_timeout 60s;
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Telegram (and an optional bank-message sender) talk to the gateway directly (no cookie session).
location /ingest/ {
    proxy_pass $gateway_up;
}
location /telegram/webhook/ {
    proxy_pass $gateway_up;
}

# The web app calls the API under /api (same origin, so SameSite=Strict cookies work); the gateway sees the path without it.
location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway_up;
}

location / {
    proxy_pass $web_up;
}
