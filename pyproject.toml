# Python workspace for the backend (uv). The web app (apps/web) stays TypeScript and has its own package.json.
#   uv sync                      # creates .venv with every package below
#   uv run pytest                # all backend tests (needs Postgres: docker compose -f docker/compose.test.yml up -d)
#   uv run pytest services/transactions
[project]
name = "lbstash-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/lbstash", "services/*"]

[tool.uv.sources]
lbstash = { workspace = true }
lbstash-auth = { workspace = true }
lbstash-gateway = { workspace = true }
lbstash-transactions = { workspace = true }
lbstash-ingest = { workspace = true }
lbstash-planning = { workspace = true }
lbstash-recurring = { workspace = true }
lbstash-reports = { workspace = true }
lbstash-telegram = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "cbor2>=5.6",
  "lbstash",
  "lbstash-auth", "lbstash-gateway", "lbstash-transactions", "lbstash-ingest", "lbstash-planning", "lbstash-recurring", "lbstash-reports", "lbstash-telegram",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/lbstash/tests", "services"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
