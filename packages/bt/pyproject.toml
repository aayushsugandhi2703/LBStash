[project]
name = "bt"
version = "0.1.0"
description = "Shared library for every budget-tracker service: money/time helpers, crypto, contracts, database, queue, clients, service kit."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "PyJWT>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "croniter>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt"]
