# Runs Terraform for the Oracle Cloud server.
#   Pull request that touches infra/terraform  -> check and plan only
#   Actions tab > Terraform > Run workflow     -> plan, apply or destroy
# Setup (secrets, variables, first run): see docs/infrastructure/SECRETS.md and docs/infrastructure/SERVER_SETUP.md.

name: Terraform

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: Type "destroy" here to confirm a destroy
        type: string
        required: false
      retry_minutes:
        description: "apply only: if Oracle has no free ARM space, keep trying every minute for this long (max 330, 0 = once)"
        type: string
        default: "0"

permissions:
  contents: read

# One Terraform run at a time, so the state is never used twice.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ACTION: ${{ inputs.action || 'plan' }}
      CONFIRM: ${{ inputs.confirm }}
      RETRY_MINUTES: ${{ inputs.retry_minutes || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop if destroy is not confirmed
        if: env.ACTION == 'destroy' && env.CONFIRM != 'destroy'
        run: |
          echo 'To destroy, type "destroy" in the confirm box.'
          exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.12"
          terraform_wrapper: false

      # Same file Terraform uses on your Mac: ~/.oci/config.
      - name: Set up Oracle Cloud login
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/tf_key.pem
          chmod 600 ~/.oci/tf_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=ap-mumbai-1
          key_file=$HOME/.oci/tf_key.pem
          EOF

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          flags=""
          if [ "$ACTION" = destroy ]; then flags="-destroy"; fi
          terraform plan -input=false -no-color $flags -out=tfplan | tee plan.txt

      - name: Show the plan
        run: |
          {
            echo "### Terraform plan ($ACTION)"
            echo '```'
            tail -n 150 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && (env.ACTION == 'apply' || env.ACTION == 'destroy')
        run: |
          if [ "$ACTION" = apply ] && [ "$RETRY_MINUTES" -gt 0 ]; then
            # Oracle often has no free ARM space. Keep trying until it does, or time runs out.
            [ "$RETRY_MINUTES" -gt 330 ] && RETRY_MINUTES=330
            end=$((SECONDS + RETRY_MINUTES * 60))
            until terraform apply -input=false -auto-approve -no-color 2>&1 | tee apply.txt; [ "${PIPESTATUS[0]}" -eq 0 ]; do
              if ! grep -q "Out of host capacity" apply.txt; then
                echo "Failed for another reason, so not retrying."
                exit 1
              fi
              if [ "$SECONDS" -ge "$end" ]; then
                echo "Gave up after $RETRY_MINUTES minutes. Run it again later."
                exit 1
              fi
              echo "No free ARM space yet. Trying again in 60 seconds."
              sleep 60
            done
          else
            terraform apply -input=false -auto-approve tfplan
          fi

      - name: Show the server address
        if: github.event_name == 'workflow_dispatch' && env.ACTION == 'apply'
        run: |
          {
            echo "### Server"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
