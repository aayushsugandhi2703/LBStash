name: Release

# Manual only: Actions tab > Release > Run workflow, then type the version.
# Nothing is built or deployed on its own. Run it from main (merge your pull request first).
#
# Versioning: x.y.z
#   x = major change or new feature
#   y = UI change, placement or fix
#   z = bug fix
#
# What it does, in order:
#   1. Checks the version is new (no git tag and no image with that version yet).
#   2. Builds every image for amd64 and arm64 and pushes :<version> and :latest to Docker Hub.
#   3. Deploys to the Oracle Cloud server: it pulls :latest and restarts (untick "deploy" to skip).
#   4. Deletes older version tags from Docker Hub.
#   5. Bumps frontend/package.json, adds an entry to docs/application/CHANGELOG.md, commits and tags vX.Y.Z.
# Steps 4 and 5 only run when everything before them worked.
# Setup (secrets, variables, first run): see docs/SECRETS.md, docs/infrastructure/SERVER_SETUP.md and docs/application/RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, x.y.z (e.g. 1.4.2)"
        required: true
        type: string
      deploy:
        description: "Deploy to the server after building"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time. A second one waits instead of cutting the first short.
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  HUB_USER: aayush2703 # Docker Hub username (not a secret)
  # Image names are ${REGISTRY}lbstash-<name>, as in docker-compose.yml.
  REGISTRY: aayush2703/
  IMAGES: base auth transactions ingest planning recurring telegram reports gateway web

jobs:
  # ---------------------------------------------------------------
  # 1. Check: is this a new, valid version?
  # ---------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this from main. Merge your pull request first."
          exit 1

      - name: Check the version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be x.y.z (got '$VERSION')"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists. Bump the version and run again."
            exit 1
          fi
          if docker manifest inspect "${REGISTRY}lbstash-web:$VERSION" > /dev/null 2>&1; then
            echo "::error::Image version $VERSION is already on Docker Hub. Bump the version and run again."
            exit 1
          fi

  # ---------------------------------------------------------------
  # 2. Build: one native build per CPU type (amd64, arm64)
  # ---------------------------------------------------------------
  build:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The two fake values only satisfy docker-compose.yml. They are not put in any image.
      - uses: docker/bake-action@v6
        env:
          IMAGE_TAG: ${{ inputs.version }}-${{ matrix.arch }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1" # keep each image a plain manifest, so they merge cleanly
          INTERNAL_SECRET: build-only
          POSTGRES_PASSWORD: build-only
        with:
          source: . # build from the checked-out folder; the default (the Git address) cannot read ../infra/docker/base.Dockerfile
          files: docker-compose.yml
          push: true
          targets: |
            base
            auth
            transactions
            ingest
            planning
            recurring
            telegram
            reports
            gateway
            web
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.cache-from=type=gha,scope=${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.arch }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ---------------------------------------------------------------
  # 3. Merge: join the two builds into one image that runs on both
  #    Tags it :<version> and :latest
  # ---------------------------------------------------------------
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Combine amd64 and arm64
        run: |
          for name in $IMAGES; do
            image="${REGISTRY}lbstash-${name}"
            docker buildx imagetools create \
              -t "$image:$VERSION" -t "$image:latest" \
              "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          done

  # ---------------------------------------------------------------
  # 4. Deploy: copy the config to the server, pull :latest, restart
  # ---------------------------------------------------------------
  deploy:
    needs: merge
    if: inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to the server
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$VM_HOST" > ~/.ssh/config

      # Only config files. The app itself runs from the images.
      - name: Copy config files
        run: |
          ssh vm 'mkdir -p ~/lbstash'
          rsync -az --relative \
            docker-compose.yml .env.example infra/scripts/gen-secrets.py \
            infra/nginx/entrypoint.sh infra/nginx/templates infra/nginx/snippets infra/nginx/certbot/entrypoint.sh \
            vm:lbstash/

      # The images are public on Docker Hub, so the server needs no login to pull them.
      - name: Update the app
        run: |
          ssh vm "REGISTRY='$REGISTRY' IMAGE_TAG='latest' LETSENCRYPT_EMAIL='$LETSENCRYPT_EMAIL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/lbstash

          # First deploy only: make .env with fresh random secrets.
          if [ ! -f .env ]; then python3 infra/scripts/gen-secrets.py; fi

          set_env() {
            if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi
          }
          set_env REGISTRY "$REGISTRY"
          set_env IMAGE_TAG "$IMAGE_TAG"
          set_env LETSENCRYPT_EMAIL "$LETSENCRYPT_EMAIL"
          # The domain comes from .env.example (copied above): one place to change it.
          domain=$(grep -E '^DOMAIN=' .env.example | cut -d= -f2)
          set_env DOMAIN "$domain"
          set_env PUBLIC_URL "https://$domain"

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          REMOTE

      # The free micro VM is slow: allow up to 10 minutes for everything to start.
      - name: Check the app is up
        run: |
          ssh vm 'port=$(grep -E "^PUBLIC_PORT=" ~/lbstash/.env | cut -d= -f2); curl -fsS --retry 120 --retry-delay 5 --retry-connrefused -o /dev/null "http://127.0.0.1:${port:-8088}/"'
          ssh vm 'cd ~/lbstash && docker compose ps'

  # ---------------------------------------------------------------
  # 5. Finish: clean up old tags, then record the release
  #    Only runs when the images are published and the deploy worked (or was skipped).
  # ---------------------------------------------------------------
  finish:
    needs: [merge, deploy]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keeps :latest and this version's tags; deletes every other tag. A failure here only warns.
      - name: Delete older version tags from Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          jwt=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "$(jq -cn --arg u "$HUB_USER" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}')" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$jwt" ] || [ "$jwt" = null ]; then
            echo "::warning::Docker Hub API login failed, so old tags were not deleted. The release is fine."
            exit 0
          fi
          echo "::add-mask::$jwt"
          for name in $IMAGES; do
            repo="$HUB_USER/lbstash-$name"
            tags=$(curl -s -H "Authorization: Bearer $jwt" "https://hub.docker.com/v2/repositories/$repo/tags/?page_size=100" | jq -r '.results[].name // empty')
            for tag in $tags; do
              case "$tag" in latest|"$VERSION"|"$VERSION-amd64"|"$VERSION-arm64") continue ;; esac
              echo "Deleting old tag $repo:$tag"
              status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: Bearer $jwt" "https://hub.docker.com/v2/repositories/$repo/tags/$tag/")
              case "$status" in 200|202|204|404) ;; *) echo "::warning::Could not delete $repo:$tag (HTTP $status). Cleanup only." ;; esac
            done
          done

      - name: Bump the version in frontend/package.json
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        working-directory: frontend

      # Built from the commit log since the last vX.Y.Z tag. A plain record of what shipped.
      - name: Update docs/application/CHANGELOG.md
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty='- %s')
            [ -n "$LOG" ] || LOG="- No commits since $PREV_TAG."
          else
            LOG="- Initial tracked release."
          fi
          RELEASE_VERSION="$VERSION" RELEASE_LOG="$LOG" python3 infra/scripts/update-changelog.py

      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json docs/application/CHANGELOG.md
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin "v$VERSION"
