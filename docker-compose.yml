# Budget Tracker: the whole stack in one file. One image per service (services/<name>/Dockerfile, apps/web/Dockerfile)
# on a shared Python base (docker/base.Dockerfile).
#   python3 scripts/gen-secrets.py   # once: writes .env with random secrets
#   docker compose up --build        # everything: db, services, gateway, web, nginx
#   docker compose --profile test up -d test-db   # throwaway Postgres for the backend tests (port 5544)
# Published to the host: `nginx` (ports 80 and 443, plus PUBLIC_PORT for plain http) and, on 127.0.0.1 only, the gateway (GATEWAY_PORT, for scripts/e2e.py).
# Push to a registry: REGISTRY=registry.example.com/team/ IMAGE_TAG=1.0 docker compose build && docker compose push
name: budget-tracker

x-env: &env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?run python3 scripts/gen-secrets.py}
  QUEUE_DATABASE_URL: postgres://bt_queue:${DB_PASSWORD_QUEUE}@db:5432/${POSTGRES_DB:-budget}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}

x-build: &build
  context: .
  additional_contexts: { budget-base: "service:base" }

x-service: &service
  restart: unless-stopped
  networks: [internal]
  depends_on:
    db-init: { condition: service_completed_successfully }

networks:
  internal: {}

volumes:
  pgdata: {}

services:
  # shared base image (build-only; services build on it)
  base:
    image: ${REGISTRY:-}budget-base:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: docker/base.Dockerfile }
    scale: 0 # never runs; exists so `service:base` can be a build context for every Python service

  # data
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 scripts/gen-secrets.py}
      POSTGRES_DB: ${POSTGRES_DB:-budget}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bt_admin} -d ${POSTGRES_DB:-budget}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # one-shot: creates a login role + schema per service (idempotent), then exits
  db-init:
    build: { context: ., dockerfile: docker/base.Dockerfile }
    image: ${REGISTRY:-}budget-base:${IMAGE_TAG:-latest}
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    command: ["python", "-m", "bt.db.init"]
    environment:
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-bt_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-budget}
      DB_PASSWORD_QUEUE: ${DB_PASSWORD_QUEUE}
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH}
      DB_PASSWORD_LEDGER: ${DB_PASSWORD_LEDGER}
      DB_PASSWORD_INGEST: ${DB_PASSWORD_INGEST}
      DB_PASSWORD_PLANNING: ${DB_PASSWORD_PLANNING}
      DB_PASSWORD_RECURRING: ${DB_PASSWORD_RECURRING}
      DB_PASSWORD_TELEGRAM: ${DB_PASSWORD_TELEGRAM}

  # services
  auth:
    <<: *service
    build: { <<: *build, dockerfile: services/auth/Dockerfile }
    image: ${REGISTRY:-}budget-auth:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_auth:${DB_PASSWORD_AUTH}@db:5432/${POSTGRES_DB:-budget}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      FIELD_KEY: ${FIELD_KEY}
      REGISTRATION: ${REGISTRATION:-first-only} # one account per install; "open" allows several
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}

  ledger:
    <<: *service
    build: { <<: *build, dockerfile: services/ledger/Dockerfile }
    image: ${REGISTRY:-}budget-ledger:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_ledger:${DB_PASSWORD_LEDGER}@db:5432/${POSTGRES_DB:-budget}

  ingest:
    <<: *service
    build: { <<: *build, dockerfile: services/ingest/Dockerfile }
    image: ${REGISTRY:-}budget-ingest:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_ingest:${DB_PASSWORD_INGEST}@db:5432/${POSTGRES_DB:-budget}
      FIELD_KEY: ${FIELD_KEY}

  planning:
    <<: *service
    build: { <<: *build, dockerfile: services/planning/Dockerfile }
    image: ${REGISTRY:-}budget-planning:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_planning:${DB_PASSWORD_PLANNING}@db:5432/${POSTGRES_DB:-budget}

  recurring:
    <<: *service
    build: { <<: *build, dockerfile: services/recurring/Dockerfile }
    image: ${REGISTRY:-}budget-recurring:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_recurring:${DB_PASSWORD_RECURRING}@db:5432/${POSTGRES_DB:-budget}

  telegram:
    <<: *service
    build: { <<: *build, dockerfile: services/telegram/Dockerfile }
    image: ${REGISTRY:-}budget-telegram:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_telegram:${DB_PASSWORD_TELEGRAM}@db:5432/${POSTGRES_DB:-budget}
      FIELD_KEY: ${FIELD_KEY}

  reports:
    <<: *service
    build: { <<: *build, dockerfile: services/reports/Dockerfile }
    image: ${REGISTRY:-}budget-reports:${IMAGE_TAG:-latest}
    environment:
      <<: *env

  gateway:
    <<: *service
    build: { <<: *build, dockerfile: services/gateway/Dockerfile }
    image: ${REGISTRY:-}budget-gateway:${IMAGE_TAG:-latest}
    ports: ["127.0.0.1:${GATEWAY_PORT:-3010}:3000"] # loopback only; the public way in is `nginx`
    environment:
      <<: *env
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      db-init: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
      ledger: { condition: service_healthy }
      ingest: { condition: service_healthy }
      planning: { condition: service_healthy }
      recurring: { condition: service_healthy }
      telegram: { condition: service_healthy }
      reports: { condition: service_healthy }

  web:
    restart: unless-stopped
    networks: [internal]
    build: { context: apps/web } # self-contained: Node, not the Python base
    image: ${REGISTRY:-}budget-web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/sign-in >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # edge
  # The one public door. nginx routes `/` to web and `/api`, `/ingest`, `/telegram/webhook` to the gateway, and terminates TLS for DOMAIN; certbot gets and renews the Let's Encrypt certificate into ./nginx/certs.
  # Until LETSENCRYPT_EMAIL is set in .env, nginx serves plain http and certbot waits. They switch to https by themselves once the certificate exists.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [internal]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${PUBLIC_PORT:-8088}:8088"]
    environment:
      DOMAIN: ${DOMAIN:-aegios.co.in}
    command: ["/bin/sh", "/start.sh"]
    volumes:
      - ./nginx/start.sh:/start.sh:ro
      - ./nginx/https.conf.template:/etc/nginx/templates-src/https.conf.template:ro
      - ./nginx/http-only.conf.template:/etc/nginx/templates-src/http-only.conf.template:ro
      - ./nginx/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./nginx/app-routes.conf:/etc/nginx/snippets/app-routes.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/webroot:/var/www/certbot:ro
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    networks: [internal]
    environment:
      DOMAIN: ${DOMAIN:-aegios.co.in}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    entrypoint: ["/bin/sh", "/certbot.sh"]
    volumes:
      - ./nginx/certbot.sh:/certbot.sh:ro
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    depends_on: [nginx]

  # Cloudflare Tunnel: serves https://DOMAIN from this machine with no open ports or public IP. Needs TUNNEL_TOKEN in .env and
  # COMPOSE_PROFILES=tunnel (or `docker compose --profile tunnel up -d`). In the Cloudflare dashboard point the tunnel's public hostname at http://nginx:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks: [internal]
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [nginx]

  # opt-in (`--profile test`): throwaway Postgres for the backend tests, in memory, port 5544.
  # Tests read TEST_DATABASE_URL=postgres://<POSTGRES_USER>:<POSTGRES_PASSWORD>@127.0.0.1:5544/<POSTGRES_DB>
  test-db:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 scripts/gen-secrets.py}
      POSTGRES_DB: ${POSTGRES_DB:-budget}
    ports: ["127.0.0.1:5544:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bt_admin} -d ${POSTGRES_DB:-budget}"]
      interval: 2s
      timeout: 3s
      retries: 20
