# LBStash: the whole stack.
#   python3 infra/scripts/gen-secrets.py   (once: creates .env)
#   docker compose up --build
name: lbstash

x-env: &env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?run python3 infra/scripts/gen-secrets.py}
  QUEUE_DATABASE_URL: postgres://lbstash_queue:${DB_PASSWORD_QUEUE}@db:5432/${POSTGRES_DB:-lbstash}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}

x-build: &build
  context: ./backend
  additional_contexts: { lbstash-base: "service:base" }

# Locked-down containers: read-only filesystem (only /tmp is writable), no Linux capabilities, no privilege gain.
x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-service: &service
  <<: *hardened
  restart: unless-stopped
  networks: [internal]
  depends_on:
    db-init: { condition: service_completed_successfully }

networks:
  internal: {}

volumes:
  pgdata: {}

services:
  # shared Python base image (build only)
  base:
    image: ${REGISTRY:-}lbstash-base:${IMAGE_TAG:-latest}
    build: { context: ./backend, dockerfile: ../infra/docker/base.Dockerfile }
    scale: 0 # build only, never runs

  # database
  db:
    <<: *hardened
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    tmpfs: ["/tmp", "/var/run/postgresql:mode=1777"]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER] # the entrypoint fixes ownership, then drops to the postgres user
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lbstash_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 infra/scripts/gen-secrets.py}
      POSTGRES_DB: ${POSTGRES_DB:-lbstash}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lbstash_admin} -d ${POSTGRES_DB:-lbstash}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # creates a database login per service, then exits
  db-init:
    <<: *hardened
    user: "10001" # the `app` user from the base image
    build: { context: ./backend, dockerfile: ../infra/docker/base.Dockerfile }
    image: ${REGISTRY:-}lbstash-base:${IMAGE_TAG:-latest}
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    command: ["python", "-m", "lbstash.db.init"]
    environment:
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-lbstash_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lbstash}
      DB_PASSWORD_QUEUE: ${DB_PASSWORD_QUEUE}
      DB_PASSWORD_AUTH: ${DB_PASSWORD_AUTH}
      DB_PASSWORD_TRANSACTIONS: ${DB_PASSWORD_TRANSACTIONS}
      DB_PASSWORD_INGEST: ${DB_PASSWORD_INGEST}
      DB_PASSWORD_PLANNING: ${DB_PASSWORD_PLANNING}
      DB_PASSWORD_RECURRING: ${DB_PASSWORD_RECURRING}
      DB_PASSWORD_TELEGRAM: ${DB_PASSWORD_TELEGRAM}

  # services
  auth:
    <<: *service
    build: { <<: *build, dockerfile: services/auth/Dockerfile }
    image: ${REGISTRY:-}lbstash-auth:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_auth:${DB_PASSWORD_AUTH}@db:5432/${POSTGRES_DB:-lbstash}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      FIELD_KEY: ${FIELD_KEY}
      REGISTRATION: ${REGISTRATION:-first-only} # "open" allows more than one account
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}

  transactions:
    <<: *service
    build: { <<: *build, dockerfile: services/transactions/Dockerfile }
    image: ${REGISTRY:-}lbstash-transactions:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_transactions:${DB_PASSWORD_TRANSACTIONS}@db:5432/${POSTGRES_DB:-lbstash}

  ingest:
    <<: *service
    build: { <<: *build, dockerfile: services/ingest/Dockerfile }
    image: ${REGISTRY:-}lbstash-ingest:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_ingest:${DB_PASSWORD_INGEST}@db:5432/${POSTGRES_DB:-lbstash}
      FIELD_KEY: ${FIELD_KEY}

  planning:
    <<: *service
    build: { <<: *build, dockerfile: services/planning/Dockerfile }
    image: ${REGISTRY:-}lbstash-planning:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_planning:${DB_PASSWORD_PLANNING}@db:5432/${POSTGRES_DB:-lbstash}

  recurring:
    <<: *service
    build: { <<: *build, dockerfile: services/recurring/Dockerfile }
    image: ${REGISTRY:-}lbstash-recurring:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_recurring:${DB_PASSWORD_RECURRING}@db:5432/${POSTGRES_DB:-lbstash}

  telegram:
    <<: *service
    build: { <<: *build, dockerfile: services/telegram/Dockerfile }
    image: ${REGISTRY:-}lbstash-telegram:${IMAGE_TAG:-latest}
    environment:
      <<: *env
      DATABASE_URL: postgres://svc_telegram:${DB_PASSWORD_TELEGRAM}@db:5432/${POSTGRES_DB:-lbstash}
      FIELD_KEY: ${FIELD_KEY}

  reports:
    <<: *service
    build: { <<: *build, dockerfile: services/reports/Dockerfile }
    image: ${REGISTRY:-}lbstash-reports:${IMAGE_TAG:-latest}
    environment:
      <<: *env

  gateway:
    <<: *service
    build: { <<: *build, dockerfile: services/gateway/Dockerfile }
    image: ${REGISTRY:-}lbstash-gateway:${IMAGE_TAG:-latest}
    ports: ["127.0.0.1:${GATEWAY_PORT:-3010}:3000"] # this computer only
    environment:
      <<: *env
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
    depends_on:
      db-init: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
      transactions: { condition: service_healthy }
      ingest: { condition: service_healthy }
      planning: { condition: service_healthy }
      recurring: { condition: service_healthy }
      telegram: { condition: service_healthy }
      reports: { condition: service_healthy }

  web:
    <<: *hardened
    restart: unless-stopped
    networks: [internal]
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"] # Next.js cache, owned by the `node` user
    build: { context: frontend } # its own Node image
    image: ${REGISTRY:-}lbstash-web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/sign-in >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # public entry: nginx serves the site; certbot gets the https certificate (needs LETSENCRYPT_EMAIL)
  nginx:
    <<: *hardened
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [internal]
    tmpfs: ["/tmp", "/run", "/var/cache/nginx", "/etc/nginx/conf.d"] # entrypoint.sh writes conf.d/default.conf
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE] # bind 80/443, then run workers as the nginx user
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${PUBLIC_PORT:-8088}:8088"]
    environment:
      DOMAIN: ${DOMAIN:-lbstash.site}
    command: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./infra/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/nginx/templates:/etc/nginx/templates-src:ro # filled in by entrypoint.sh
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/certbot/certs:/etc/letsencrypt:ro
      - ./infra/nginx/certbot/webroot:/var/www/certbot:ro
    depends_on:
      gateway: { condition: service_healthy }
      web: { condition: service_healthy }

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER] # writes certificates into the mounted folders
    security_opt: ["no-new-privileges:true"]
    environment:
      DOMAIN: ${DOMAIN:-lbstash.site}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./infra/nginx/certbot/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/nginx/certbot/certs:/etc/letsencrypt
      - ./infra/nginx/certbot/webroot:/var/www/certbot
    depends_on: [nginx]

  # optional https without open ports: needs TUNNEL_TOKEN and COMPOSE_PROFILES=tunnel
  cloudflared:
    <<: *hardened
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks: [internal]
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [nginx]

  # optional (--profile test): throwaway database for backend tests, port 5544
  test-db:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lbstash_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 infra/scripts/gen-secrets.py}
      POSTGRES_DB: ${POSTGRES_DB:-lbstash}
    ports: ["127.0.0.1:5544:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lbstash_admin} -d ${POSTGRES_DB:-lbstash}"]
      interval: 2s
      timeout: 3s
      retries: 20
